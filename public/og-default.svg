<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <filter id="blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="90" />
    </filter>
  </defs>
  <rect width="1200" height="630" fill="#ffffff" />

  <!-- Brand mesh atmosphere (hero scale) -->
  <g filter="url(#blur)" opacity="0.5">
    <circle cx="140" cy="90" r="170" fill="#007cf0" />
    <circle cx="430" cy="40" r="160" fill="#00dfd8" />
    <circle cx="720" cy="80" r="170" fill="#7928ca" />
    <circle cx="960" cy="40" r="160" fill="#ff0080" />
    <circle cx="1140" cy="120" r="180" fill="#f9cb28" />
  </g>

  <!-- Mark -->
  <rect x="100" y="250" width="64" height="64" rx="14" fill="#171717" />
  <text x="132" y="296" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="32" font-weight="600" fill="#ffffff">{}</text>

  <!-- Wordmark + headline -->
  <text x="184" y="300" font-family="Inter, system-ui, sans-serif" font-size="34" font-weight="600" fill="#171717" letter-spacing="-1">JSON Beam</text>
  <text x="100" y="400" font-family="Inter, system-ui, sans-serif" font-size="56" font-weight="600" fill="#171717" letter-spacing="-2.4">The professional JSON workbench.</text>
  <text x="100" y="452" font-family="Inter, system-ui, sans-serif" font-size="28" font-weight="400" fill="#4d4d4d">Format, validate, repair &amp; convert — private and fast.</text>

  <!-- Footer line -->
  <text x="100" y="540" font-family="ui-monospace, Menlo, monospace" font-size="22" fill="#888888">jsonbeam.com · 100% client-side · free</text>
</svg>
